<script>
(()=>{
const root=document.documentElement,scenes=JSON.parse(document.getElementById('scene-data').textContent),host=document.getElementById('scene-host'),label=document.getElementById('scene-label'),language=document.getElementById('language'),another=document.getElementById('another'),mode=document.getElementById('mode'),motion=document.getElementById('motion');
if(root.dataset.embed){
const embed=root.dataset.embed,params=new URLSearchParams(location.search);
const send=m=>parent.postMessage(m,location.origin);
let current=0,ordered=params.get('mode')==='order',paused=false;
const index=id=>typeof id==='string'&&/^\d{2}$/.test(id)?scenes.findIndex(s=>s.id===id):-1;
const random=previous=>{const choices=scenes.map((_,i)=>i).filter(i=>i!==previous);return choices[Math.floor(Math.random()*choices.length)]??0};
const height=()=>send({type:'err404-height',px:Math.ceil(document.documentElement.getBoundingClientRect().height)});
function labels(){const zh=root.lang==='zh';label.textContent=scenes[current].title[zh?'zh':'en']+' · '+(zh?'第 '+(current+1)+' 张，共 '+scenes.length+' 张':'No. '+(current+1)+' of '+scenes.length);another.querySelector('.en').textContent=ordered?'Next':'Show another';another.querySelector('.zh').textContent=ordered?'下一张':'换一张';mode.querySelector('.en').textContent=ordered?'Random':'In order';mode.querySelector('.zh').textContent=ordered?'随机':'按顺序';mode.setAttribute('aria-pressed',String(ordered));motion.querySelector('.en').textContent=paused?'Play animation':'Pause animation';motion.querySelector('.zh').textContent=paused?'继续动画':'暂停动画'}
function show(n){current=n;host.replaceChildren(document.getElementById('scene-'+scenes[n].id).content.cloneNode(true));labels();if(embed==='stage')height()}
function period(){let ms=-Infinity;try{for(const a of host.getAnimations({subtree:true})){const t=a.effect.getTiming(),value=Number(t.delay)+Number(t.duration);if(Number.isFinite(value))ms=Math.max(ms,value)}}catch{}return Math.max(3000,Math.min(12000,Number.isFinite(ms)?ms:6000))}
function play(){let recent=[];try{const saved=JSON.parse(sessionStorage.getItem('err404-slide-recent'));if(Array.isArray(saved))recent=saved.filter(id=>index(id)>=0).slice(-8)}catch{}const choices=scenes.map((s,i)=>i).filter(i=>!recent.includes(scenes[i].id));const n=choices[Math.floor(Math.random()*choices.length)];show(n);recent.push(scenes[n].id);try{sessionStorage.setItem('err404-slide-recent',JSON.stringify(recent.slice(-8)))}catch{}send({type:'err404-period',ms:period(),scene:scenes[n].id})}
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==parent)return;const m=event.data;if(!m||typeof m!=='object')return;if(embed==='slide'){if(m.type==='err404-play')play();else if(m.type==='err404-stop')host.replaceChildren()}else if(m.type==='err404-pick'){const n=index(m.scene);if(n>=0)show(n)}});
if(embed==='slide'){host.replaceChildren();send({type:'err404-ready'})}else{
for(const a of document.querySelectorAll('a[href]'))a.target='_top';
another.hidden=mode.hidden=motion.hidden=false;
another.addEventListener('click',()=>show(ordered?(current+1)%scenes.length:random(current)));
mode.addEventListener('click',()=>{ordered=!ordered;show(ordered?0:random(current))});
motion.addEventListener('click',()=>{paused=!paused;root.classList.toggle('paused',paused);motion.setAttribute('aria-pressed',String(paused));labels()});
const first=index(params.get('scene'));show(first>=0?first:random(-1));
new ResizeObserver(height).observe(document.documentElement);
}return;
}
let current=0,paused=false;
const read=k=>{try{return localStorage.getItem(k)}catch{return null}},write=(k,v)=>{try{localStorage.setItem(k,String(v))}catch{}};
const params=new URLSearchParams(location.search),requested=params.get('mode');
let ordered=(requested==='order'||requested==='random'?requested:read('404-mode'))==='order';write('404-mode',ordered?'order':'random');
function pick(previous){if(scenes.length<2)return 0;const p=Number(previous),valid=previous!==null&&Number.isInteger(p)&&p>=0&&p<scenes.length;const n=Math.floor(Math.random()*(scenes.length-(valid?1:0)));return valid&&n>=p?n+1:n}
function labels(){const zh=root.lang==='zh';document.title=zh?'这里暂时没有内容':'Nothing here right now';label.textContent=scenes[current].title[zh?'zh':'en']+' · '+(zh?'第 '+(current+1)+' 张，共 '+scenes.length+' 张':'No. '+(current+1)+' of '+scenes.length);another.querySelector('.en').textContent=ordered?'Next':'Show another';another.querySelector('.zh').textContent=ordered?'下一张':'换一张';mode.querySelector('.en').textContent=ordered?'Random':'In order';mode.querySelector('.zh').textContent=ordered?'随机':'按顺序';mode.setAttribute('aria-pressed',String(ordered));motion.querySelector('.en').textContent=paused?'Play animation':'Pause animation';motion.querySelector('.zh').textContent=paused?'继续动画':'暂停动画';language.setAttribute('aria-label',zh?'Switch to English':'切换到中文');document.querySelector('nav').setAttribute('aria-label',zh?'去这些地方看看':'Explore');if(window.fixOrphans)window.fixOrphans()}
function show(n){current=n;host.replaceChildren(document.getElementById('scene-'+scenes[n].id).content.cloneNode(true));write('404-previous',n);labels()}
function syncURL(){try{const u=new URL(location.href);u.searchParams.delete('scene');u.searchParams.delete('mode');if(ordered)u.searchParams.set('mode','order');history.replaceState(null,'',u)}catch{}}
language.hidden=another.hidden=mode.hidden=motion.hidden=false;
language.addEventListener('click',()=>{root.lang=root.lang==='zh'?'en':'zh';write('404-language',root.lang);try{const u=new URL(location.href);u.searchParams.set('lang',root.lang);history.replaceState(null,'',u)}catch{}labels()});
another.addEventListener('click',()=>{show(ordered?(current+1)%scenes.length:pick(current));syncURL()});
mode.addEventListener('click',()=>{ordered=!ordered;write('404-mode',ordered?'order':'random');show(ordered?0:pick(current));syncURL()});
motion.addEventListener('click',()=>{paused=!paused;root.classList.toggle('paused',paused);motion.setAttribute('aria-pressed',String(paused));labels()});
const forced=params.get('scene'),found=/^\d+$/.test(forced||'')?scenes.findIndex(s=>Number(s.id)===Number(forced)):-1;
show(found>=0?found:ordered?0:pick(read('404-previous')));
})();
</script>
<script>
// Keep a small final phrase together, then measure Chinese lines after font/layout changes.
(()=>{let frame;const originals=new WeakMap();function fix(){cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{document.querySelectorAll('[data-orphan] > span').forEach(el=>{if(!originals.has(el))originals.set(el,el.textContent);const raw=originals.get(el);el.textContent=raw;if(!el.getClientRects().length)return;if(el.classList.contains('en')){el.textContent=raw.replace(/ (\S+) (\S+)$/,' $1\u00a0$2');return}const chars=Array.from(raw),range=document.createRange();if(chars.length<5)return;let line=[];const node=el.firstChild;for(let i=0;i<chars.length;i++){range.setStart(node,chars.slice(0,i).join('').length);range.setEnd(node,chars.slice(0,i+1).join('').length);const box=range.getBoundingClientRect();line.push(box.top)}const finalTop=line.at(-1);let n=0;for(let i=line.length-1;i>=0&&Math.abs(line[i]-finalTop)<2;i--)n++;const han=chars.slice(-n).filter(c=>/\p{Script=Han}/u.test(c)).length;if(n>0&&han<=2){const keep=Math.min(chars.length,n+3);el.textContent=chars.slice(0,-keep).join('');const tail=document.createElement('span');tail.style.whiteSpace='nowrap';tail.textContent=chars.slice(-keep).join('');el.append(tail)}})})}window.fixOrphans=fix;window.addEventListener('resize',fix);if(document.fonts)document.fonts.ready.then(fix);fix()})();
</script>
